dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0
auth_allow_cleartext = yes
auth_mechanisms = plain login
log_path = /var/log/dovecot
mail_driver = maildir
mail_path = /var/mail/vhosts/%{user | domain}/%{user | username}
protocols = imap pop3 lmtp

# Mailbox encryption. Each user has their own key pair; the mail is encrypted
# to it as it is stored. The key is itself encrypted with a per-mailbox secret
# that email_create_user generates and keeps as a userdb field next to the
# password hash, so a mailbox stays readable when the user changes password.
# Mail already on disk when this is switched on stays as it is; only new mail
# is encrypted.
mail_plugins {
  mail_crypt = yes
}

mail_attribute {
  dict file {
    path = /var/mail/vhosts/%{user|domain}/%{user|username}/dovecot-attributes
  }
}

crypt_user_key_curve = secp521r1
crypt_user_key_require_encrypted = yes

passdb passwd-file {
  driver = passwd-file
  # old: /var/mail/vhosts/%d/shadow
  passwd_file_path = /var/mail/vhosts/%{user|domain}/shadow
}

userdb passwd-file {
  driver = passwd-file
  # old: /var/mail/vhosts/%d/passwd
  passwd_file_path = /var/mail/vhosts/%{user|domain}/passwd
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    group = vmail
    mode = 0660
    user = postfix
  }
  unix_listener auth-master {
    group = vmail
    mode = 0600
    user = vmail
  }
}

# Postfix delivers here (virtual_transport), so mail is encrypted as stored
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    group = postfix
    mode = 0600
    user = postfix
  }
}

protocol lmtp {
  postmaster_address = root@HERMES_HOSTNAME
  mail_plugins {
    sieve = yes
    mail_crypt = yes
  }
}

ssl_server {
  cert_file = /etc/dovecot/ssl/mailserver.crt
  key_file = /etc/dovecot/ssl/mailserver.key
}

protocol lda {
  auth_socket_path = /var/run/dovecot/auth-master
  hostname = HERMES_HOSTNAME
  mail_plugin_dir = /usr/lib/dovecot/modules
  # delivery is where mail gets encrypted, so both plugins are named here
  # rather than relying on the global list being inherited
  mail_plugins {
    sieve = yes
    mail_crypt = yes
  }
  postmaster_address = root@HERMES_HOSTNAME
}
