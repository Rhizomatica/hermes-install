server {
	listen 80 default_server;
	server_name _;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2 ipv6only=on;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/ssl/certs/hermes.radio.crt;
	ssl_certificate_key /etc/ssl/private/hermes.radio.key;

#	ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS';
	# BEGIN HERMES_HARDENING (removed by tasks/web-server_setup.sh otherwise)
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
	# END HERMES_HARDENING
	ssl_prefer_server_ciphers on;
	ssl_session_cache shared:HERMES:1m;
	ssl_session_timeout 1h;

	# BEGIN HERMES_HARDENING (removed by tasks/web-server_setup.sh otherwise)
	# the station is reached over https only
	add_header Strict-Transport-Security "max-age=15768000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin" always;
	# the GUI is served from the station itself and talks to /api and the
	# radio daemon websocket; Angular needs inline styles and eval
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'" always;
	# END HERMES_HARDENING

	client_max_body_size  100M;
	fastcgi_read_timeout 720s;

	root /var/www/html;

    index index.php index.html;

	location / {
		try_files $uri $uri/ /;
	}

	location /downloads {
		try_files $uri $uri/ /;
	}

	location /api {
	    try_files $uri $uri/ /api/index.php?$query_string;
	}
	if ($accept_language ~ "^$") {
	    set $accept_language "HERMESLANGNGINX";
	}

    rewrite ^/$ /$accept_language permanent;
    location ~ ^/(pt|es|en-US|fr) {
        try_files $uri /$1/index.html?$args;
    }


	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/var/run/php/php-fpm.sock;
	}
}
