# HERMES sshd hardening, installed as /etc/ssh/sshd_config.d/hermes.conf
#
# Only installed when conf/ssh/authorized_keys exists in the installer, so a
# station is never left without a way in.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
X11Forwarding no
