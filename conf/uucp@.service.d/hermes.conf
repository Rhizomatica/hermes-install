# HERMES: uucico checks the login itself, against /etc/uucp/passwd.  The
# uucp package's own unit may run in.uucpd instead (Debian's does: PAM and
# Unix accounts, which have no "user"), and every package upgrade rewrites
# that unit.  This override survives upgrades.
[Service]
ExecStart=
ExecStart=-/usr/sbin/uucico -l
